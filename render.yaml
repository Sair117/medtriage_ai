services:
  - type: web
    name: medtriage-ai
    runtime: python
    buildCommand: pip install -r requirements.txt && cd backend && python ingest.py
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.0
