<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MedTriage AI — Intelligent medical intake triage assistant that helps patients describe symptoms and routes them to the right department.">
    <title>MedTriage AI — Medical Intake Triage</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-icon">🏥</div>
            <div class="header-info">
                <h1>MedTriage AI</h1>
                <p>Medical Intake Triage Assistant</p>
            </div>
            <div class="connection-status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </header>

        <div class="disclaimer">
            ⚠️ This is an AI-powered demo for educational purposes only. It does not provide real medical advice. In a real emergency, call your local emergency number immediately.
        </div>

        <div class="chat-container" id="chatContainer"></div>

        <div class="input-container">
            <input
                type="text"
                id="messageInput"
                placeholder="Describe your symptoms..."
                autocomplete="off"
                disabled
            >
            <button class="send-btn" id="sendBtn" disabled aria-label="Send message">
                ➤
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
